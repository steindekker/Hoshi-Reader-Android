[project]
name = "ankienrich"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jaconv>=0.3",      # katakana->hiragana (kana.hira, audio reading match)
    "tinycss2>=1.2",    # robust dict-styles.css scoping in defs/build.py
    "requests>=2",      # single HTTP client (massif scraper + telegram notify)
]

[project.scripts]
anki-enrich = "ankienrich.cli:main"
anki-enrich-bot = "ankienrich.bot:main"

[dependency-groups]
dev = ["pytest>=8", "anki>=24.11"]
jrp = ["sudachipy>=0.6.8", "sudachidict-full>=20240409"]
wizard = ["questionary>=2"]
bot = ["pyTelegramBotAPI>=4"]

[tool.uv]
default-groups = ["dev", "jrp", "wizard", "bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ankienrich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
