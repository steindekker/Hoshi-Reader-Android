[package]
name = "hoshi-pack-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bumpalo = { version = "3.20.3", features = ["collections"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
foldhash = "0.2"
hashbrown = "0.17"
libc = "0.2.190"
libz-sys = { version = "1.1.30", default-features = false, features = ["static"] }
memmap2 = "0.9.11"
rayon = "1.12.0"
regex = "1.13.1"
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", default-features = false }
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
