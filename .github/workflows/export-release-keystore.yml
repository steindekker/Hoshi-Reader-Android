name: Export release keystore

# One-shot recovery for the release signing secrets already used by
# release-apk.yml. The job uploads age ciphertext only. Delete this
# workflow and its run after the artifact is stored locally.

"on":
  workflow_dispatch:
    inputs:
      age_recipient:
        description: "age public key (age1...) that can decrypt the artifact"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  export:
    name: Encrypt release signing material
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'steindekker' && github.repository == 'steindekker/Hoshi-Reader-Android'
    steps:
      - name: Encrypt signing material for the given age recipient
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AGE_RECIPIENT: ${{ inputs.age_recipient }}
        run: |
          set -euo pipefail
          umask 077

          if [[ "${GITHUB_ACTOR}" != "steindekker" || "${GITHUB_REPOSITORY}" != "steindekker/Hoshi-Reader-Android" ]]; then
            echo "This export only runs for the repository owner." >&2
            exit 1
          fi
          if [[ ! "${AGE_RECIPIENT}" =~ ^age1[0-9a-z]{58}$ ]]; then
            echo "age_recipient must be one age public key." >&2
            exit 1
          fi
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "${name} is empty." >&2
              exit 1
            fi
          done

          archive="${RUNNER_TEMP}/age-v1.3.2-linux-amd64.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  ${archive}" \
            | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xzf "${archive}"

          work="${RUNNER_TEMP}/release-signing"
          cleanup() {
            if [[ -d "${work}" ]]; then
              find "${work}" -type f -exec shred -u {} + || true
              rm -rf "${work}"
            fi
          }
          trap cleanup EXIT
          mkdir -p "${work}"
          keystore="${work}/hoshi-release-keystore.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"

          python3 - <<'PY'
          import os
          import shlex
          from pathlib import Path

          work = Path(os.environ["RUNNER_TEMP"]) / "release-signing"
          data = (work / "hoshi-release-keystore.jks").read_bytes()
          if len(data) < 32 or not (
              data.startswith(b"\xfe\xed\xfe\xed") or data[:1] == b"\x30"
          ):
              raise SystemExit("decoded keystore is not a JKS or PKCS12 file")
          names = (
              "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD",
          )
          lines = []
          for name in names:
              value = os.environ[name]
              if "\n" in value or "\x00" in value:
                  raise SystemExit(f"{name} contains a newline or NUL")
              lines.append(f"{name}={shlex.quote(value)}")
          env_path = work / "release-signing.env"
          env_path.write_text("\n".join(lines) + "\n")
          env_path.chmod(0o600)
          PY

          out="${RUNNER_TEMP}/hoshi-release-signing.age"
          tar -C "${work}" -cf - hoshi-release-keystore.jks release-signing.env \
            | "${RUNNER_TEMP}/age/age" -r "${AGE_RECIPIENT}" -o "${out}"
          test -s "${out}"

      - name: Upload encrypted signing material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hoshi-release-signing
          path: ${{ runner.temp }}/hoshi-release-signing.age
          if-no-files-found: error
          retention-days: 1
