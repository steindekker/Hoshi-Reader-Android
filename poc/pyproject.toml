[project]
name = "ankialign"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
anki-align = "ankialign.cli:main"

[dependency-groups]
dev = ["pytest>=8", "anki>=24.11"]
jrp = ["sudachipy>=0.6.8", "sudachidict-full>=20240409"]

# `uv run` pulls anki + sudachi automatically, so the console scripts work
# with no --group/--with flags.
[tool.uv]
default-groups = ["dev", "jrp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ankialign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
