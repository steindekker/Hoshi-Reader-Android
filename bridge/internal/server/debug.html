<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hoshi-bridge</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --fg:#1d1d1f; --muted:#6b6b70; --card:#fff; --line:#e3e3e6; --ok:#1f8a3b; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151517; --fg:#ececf0; --muted:#9a9aa2; --card:#1e1e21; --line:#2c2c31; --ok:#4cc26b; --bad:#ff6b5e; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .muted { color:var(--muted); font-size:13px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td, th { text-align:left; padding:3px 8px 3px 0; vertical-align:top; overflow-wrap:anywhere; }
  #log { list-style:none; margin:0; padding:0; }
  #log li { padding:6px 0; border-top:1px solid var(--line); font-size:17px; }
  #log li:first-child { border-top:0; }
  #log .meta { color:var(--muted); font-size:12px; margin-right:8px; font-variant-numeric:tabular-nums; }
  button, input { font:inherit; padding:4px 10px; }
  #shot, #clip { max-width:100%; margin-top:8px; border-radius:6px; display:none; }
  audio { display:block; margin-top:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
<main>
  <h1>hoshi-bridge <span id="conn" class="muted">connecting…</span></h1>
  <div class="card">
    <div class="row">
      <input id="token" type="password" placeholder="token (if configured)" size="24">
      <button id="save">Use token</button>
      <span id="mediainfo" class="muted"></span>
    </div>
    <img id="shot" alt="">
    <audio id="aud" controls hidden></audio>
  </div>
  <div class="card"><table id="status"></table></div>
  <div id="sessions"></div>
  <div class="card"><div class="muted">Text threads</div><ul id="threads"><li class="muted">No game hooked yet.</li></ul></div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let token = "";
  try { token = new URLSearchParams(location.hash.slice(1)).get("token") || localStorage.getItem("hoshi-bridge-token") || ""; } catch (_) {}
  $("token").value = token;
  const headers = () => token ? { Authorization: "Bearer " + token } : {};
  let ws, retry;
  const sessions = new Map();

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function ts(ms) { if (ms == null) return ""; const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  function renderBridge(b) {
    const rows = [["host", esc(b.hostname) + " · v" + esc(b.version) + " · protocol " + b.protocol],
                  ["screenshot", b.screenshot.available ? '<span class="ok">' + esc(b.screenshot.backend) + "</span>" : '<span class="muted">unavailable</span>']];
    if (b.hook && b.hook.enabled) {
      const h = b.hook;
      let v = esc(h.state || "");
      if (h.game) v += " · " + esc(h.game);
      if (h.engine) v += " · " + esc(h.engine);
      if (h.error) v += "<br><span class='bad'>" + esc(h.error) + "</span>";
      rows.push(["hook", v]);
    }
    for (const s of b.sources) {
      rows.push([esc(s.id) + " <span class='muted'>(" + esc(s.kind) + ")</span>",
        (s.connected ? '<span class="ok">connected</span>' : '<span class="bad">disconnected</span>') +
        " <span class='muted'>" + esc(s.target) + "</span>" + (s.lastError ? "<br><span class='muted'>" + esc(s.lastError) + "</span>" : "")]);
    }
    $("status").innerHTML = rows.map(r => "<tr><th>" + r[0] + "</th><td>" + r[1] + "</td></tr>").join("");
  }

  function renderSessions() {
    const html = [];
    for (const s of sessions.values()) {
      const pb = s.playback ? (s.playback.paused ? "paused" : "playing") + " " + ts(s.playback.positionMs) : "";
      const cues = s.cues.slice(-60).reverse();
      html.push("<div class='card'><div class='row'><b>" + esc(s.title || s.id) + "</b><span class='muted'>" + esc(s.kind) +
        " · " + esc(s.source) + " · track " + esc(s.trackId) + " · " + s.cues.length + " cues · " + esc(pb) + " · " +
        esc(s.capabilities.join(", ")) + "</span></div><ul id='log'>" +
        cues.map(c => "<li><span class='meta'>#" + c.id + " " + (c.startMs != null ? ts(c.startMs) : new Date(c.at).toLocaleTimeString()) + "</span>" +
          esc(c.text) + " " + s.capabilities.filter(k => k !== "control").map(k =>
            "<button data-session='" + esc(s.id) + "' data-track='" + esc(s.trackId) + "' data-cue='" + c.id + "' data-kind='" + k + "'>" + k + "</button>").join(" ") +
          "</li>").join("") + "</ul></div>");
    }
    $("sessions").innerHTML = html.join("");
  }

  $("sessions").onclick = async (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    const kind = b.dataset.kind;
    $("mediainfo").textContent = kind + "…";
    const t0 = performance.now();
    try {
      const r = await fetch("v2/sessions/" + encodeURIComponent(b.dataset.session) + "/" + kind, {
        method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, headers()),
        body: JSON.stringify({ trackId: b.dataset.track, cueId: Number(b.dataset.cue) })
      });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || r.status); }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      if (kind === "audio") { $("aud").src = url; $("aud").hidden = false; $("aud").play(); }
      else { $("shot").src = url; $("shot").style.display = "block"; }
      $("mediainfo").textContent = kind + ": " + Math.round(blob.size / 1024) + " KB in " + Math.round(performance.now() - t0) + " ms";
    } catch (e) { $("mediainfo").textContent = kind + " failed: " + e.message; }
  };

  function renderThreads(list) {
    const items = (list && list.threads) || [];
    if (!items.length) {
      $("threads").innerHTML = "<li class='muted'>No text threads yet. Advance the game's dialogue.</li>";
      return;
    }
    $("threads").innerHTML = items.map(t => {
      const sample = t.samples && t.samples.length ? t.samples[t.samples.length - 1].text : "";
      return "<li>" + (t.selected ? "<b>selected</b> " : "") + esc(t.name || t.hookCode) +
        " <span class='muted'>" + esc(t.score) + "</span><br>" + esc(sample) +
        " <button data-thread='" + esc(t.id) + "'>use</button></li>";
    }).join("") + "<li><button id='hook-auto'>automatic</button></li>";
  }

  $("threads").onclick = async (ev) => {
    const btn = ev.target.closest("button");
    if (!btn) return;
    const body = btn.id === "hook-auto" ? { threadId: null } : { threadId: btn.dataset.thread };
    const r = await fetch("v2/hook/threads/select", {
      method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, headers()),
      body: JSON.stringify(body)
    });
    if (r.ok) renderThreads(await r.json());
  };

  function connect() {
    clearTimeout(retry);
    if (ws) { ws.onclose = null; ws.close(); }
    const u = new URL("v2/ws", location.href);
    u.protocol = location.protocol === "https:" ? "wss:" : "ws:";
    if (token) u.searchParams.set("token", token);
    ws = new WebSocket(u);
    ws.onopen = () => { $("conn").textContent = "live"; $("conn").className = "ok"; };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "hello") {
        renderBridge(m.bridge);
        sessions.clear();
        m.sessions.forEach(s => sessions.set(s.id, s));
      } else if (m.type === "bridge") renderBridge(m.bridge);
      else if (m.type === "threads") renderThreads(m);
      else if (m.type === "session") {
        const old = sessions.get(m.session.id);
        sessions.set(m.session.id, Object.assign({ cues: [] }, old, m.session, old && old.trackId !== m.session.trackId ? { cues: [] } : {}));
      } else if (m.type === "sessionEnded") sessions.delete(m.sessionId);
      else if (m.type === "cues") {
        const s = sessions.get(m.sessionId);
        if (!s) return;
        s.trackId = m.trackId;
        s.cues = m.mode === "replace" ? m.cues : s.cues.concat(m.cues).slice(-500);
      } else if (m.type === "playback") {
        const s = sessions.get(m.sessionId);
        if (s) s.playback = { positionMs: m.positionMs, paused: m.paused, speed: m.speed, at: m.at };
      }
      renderSessions();
    };
    ws.onclose = () => { $("conn").textContent = "disconnected, retrying…"; $("conn").className = "bad"; retry = setTimeout(connect, 2000); };
  }

  $("save").onclick = () => {
    token = $("token").value.trim();
    try { localStorage.setItem("hoshi-bridge-token", token); } catch (_) {}
    connect();
  };

  connect();
})();
</script>
</body>
</html>
